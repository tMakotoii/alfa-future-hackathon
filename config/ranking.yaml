# Веса компонентов объяснимого score (сумма = 1) и параметры ранжирования.
weights: {sector: 0.30, macro: 0.25, products: 0.15, counterparties: 0.15, region: 0.05, freshness: 0.05, bank_view: 0.05}
min_score: 0.15
half_life_days: 3
# Множители роли: по факторам новости, по продуктам и по компонентам.
role_multipliers:
  CEO: {components: {sector: 1.5}, factors: {"regulation:*": 1.5}}
  CFO: {factors: {rate: 1.5, fx: 1.5}}
  TREASURER: {factors: {rate: 1.5, fx: 1.5}, products: {deposit: 1.5}}
# Какие продукты группы чувствительны к фактору.
product_map:
  rate: [credit, leasing, deposit, guarantee, factoring]
  fx: [fts]
  sanctions: [fts]
  "regulation:customs": [fts]
  logistics: [fts]
# Ключевые слова фактора для поиска позиции банка (FTS по аналитике).
factor_keywords:
  rate: ключевая ставка
  inflation: инфляция
  fx: курс рубля
  "commodities:oil": нефть
  "commodities:metals": сталь металлургия
  "commodities:grain": зерно
  "commodities:gold": золото
  consumer_demand: потребление спрос
  gov_orders: бюджет госрасходы
  "regulation:tax": налог
  "regulation:customs": импорт пошлины
  "regulation:construction": ипотека строительство
  "regulation:auto": автомобили
  sanctions: санкции
  logistics: логистика
  labor: рынок труда зарплаты
